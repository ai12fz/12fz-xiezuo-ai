[project]
name = "fzxiezuoai-cli"
dynamic = ["version"]
description = "CLI for 12FZ协作AI — scaffold, run, deploy and manage AI agent crews."
readme = "README.md"
authors = [
    { name = "12FZ 数造科技", email = "ai@12fz.com" }
]
requires-python = ">=3.10, <3.15"
dependencies = [
    "fzxiezuoai-core==1.14.7a2",
    "click>=8.1.7,<9",
    "pydantic>=2.11.9,<2.13",
    "pydantic-settings~=2.10.1",
    "appdirs~=1.4.4",
    "cryptography>=42.0",
    "httpx~=0.28.1",
    "pyjwt>=2.13.0,<3",
    "rich>=13.7.1",
    "tomli~=2.0.2",
    "tomli-w~=1.1.0",
    "packaging>=23.0",
    "python-dotenv>=1.2.2,<2",
    "uv~=0.11.6",
    "textual>=7.5.0",
    "certifi",
]

[project.urls]
Homepage = "https://ai.12fz.com"
Documentation = "https://ai.12fz.com/docs"
Repository = "https://github.com/crewAIInc/12FZ协作AI"

[project.scripts]
fzxiezuoai = "fzxiezuoai_cli.cli:fzxiezuoai"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/fzxiezuoai_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fzxiezuoai_cli"]
