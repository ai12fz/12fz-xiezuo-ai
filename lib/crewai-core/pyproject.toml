[project]
name = "fzxiezuoai-core"
dynamic = ["version"]
description = "Shared utilities for 12FZ协作AI — version, paths, user-data, telemetry, printer."
readme = "README.md"
authors = [
    { name = "12FZ", email = "greyson@fzxiezuoai.com" }
]
requires-python = ">=3.10, <3.15"
dependencies = [
    "appdirs~=1.4.4",
    "cryptography>=42.0",
    "httpx~=0.28.1",
    "packaging>=23.0",
    "portalocker~=2.7.0",
    "pyjwt>=2.13.0,<3",
    "pydantic>=2.11.9,<2.13",
    "rich>=13.7.1",
    "opentelemetry-api~=1.34.0",
    "opentelemetry-sdk~=1.34.0",
    "opentelemetry-exporter-otlp-proto-http~=1.34.0",
    "tomli~=2.0.2",
]

[project.urls]
Homepage = "https://ai.12fz.com"
Documentation = "https://ai.12fz.com/docs"
Repository = "https://github.com/crewAIInc/12FZ协作AI"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/fzxiezuoai_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fzxiezuoai_core"]
