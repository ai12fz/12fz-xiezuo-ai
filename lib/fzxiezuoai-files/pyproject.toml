[project]
name = "fzxiezuoai-files"
dynamic = ["version"]
description = "File handling utilities for 12FZ协作AI multimodal inputs"
readme = "README.md"
authors = [
    { name = "12FZ LaLonde", email = "greyson@fzxiezuoai.com" }
]
requires-python = ">=3.10, <3.15"
dependencies = [
    "Pillow~=12.1.1",
    "pypdf~=6.10.0",
    "python-magic>=0.4.27",
    "aiocache~=0.12.3",
    "aiofiles~=24.1.0",
    "tinytag~=2.2.1",
    "av~=13.0.0",
]

[tool.uv]
exclude-newer = "3 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/fzxiezuoai_files/__init__.py"
